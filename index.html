  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-area">
        <button class="icon-button" id="menuButton" aria-label="Main menu" data-tooltip="Main menu"><svg><use href="#i-menu"/></svg></button>
        <button class="gmail-brand" id="brandButton" aria-label="Gmail home">
          <svg class="gmail-mark" viewBox="0 0 40 30" aria-hidden="true"><path fill="#4285f4" d="M3 6v20h7V12l10 8 10-8v14h7V6l-5-3-12 9L8 3z"/><path fill="#34a853" d="M3 6v20h7V12L3 6z"/><path fill="#fbbc04" d="m8 3 12 9 4-3L12 0z"/><path fill="#ea4335" d="M37 6v20h-7V12L20 20v-8l12-9z"/></svg>
          <span>Gmail</span>
        </button>
      </div>

      <form class="search-box" id="searchForm" role="search">
        <button type="submit" class="icon-button" aria-label="Search"><svg><use href="#i-search"/></svg></button>
        <input id="searchInput" autocomplete="off" placeholder="Search mail" aria-label="Search mail">
        <button type="button" class="icon-button" id="searchOptionsButton" aria-label="Show search options" data-tooltip="Show search options"><svg><use href="#i-tune"/></svg></button>
        <div class="advanced-search" id="advancedSearch">
          <label>From<input id="searchFrom" placeholder="Sender name or email"></label>
          <label>Subject<input id="searchSubject" placeholder="Words in the subject"></label>
          <label class="search-check"><input type="checkbox" id="searchStarred"> Is starred</label>
          <div><button type="button" class="text-button" id="clearAdvanced">Clear</button><button type="button" class="primary-button" id="applyAdvanced">Search</button></div>
        </div>
      </form>

      <nav class="top-actions" aria-label="Google controls">
        <button class="icon-button desktop-only" id="helpButton" aria-label="Support" data-tooltip="Support"><svg><use href="#i-help"/></svg></button>
        <button class="icon-button" id="settingsButton" aria-label="Settings" data-tooltip="Settings"><svg><use href="#i-settings"/></svg></button>
        <button class="gemini-button" id="geminiButton" aria-label="Ask Gemini"><svg><use href="#i-gemini"/></svg><span>Ask Gemini</span></button>
        <button class="icon-button desktop-only" id="appsButton" aria-label="Google apps" data-tooltip="Google apps"><svg><use href="#i-apps"/></svg></button>
        <button class="avatar" id="profileButton" aria-label="Google account">?</button>
      </nav>
    </header>

    <aside class="sidebar" id="sidebar">
      <button class="compose-button" id="composeButton"><svg aria-hidden="true"><use href="#i-compose"/></svg><span>Compose</span></button>
      <nav id="folderNav" class="folder-nav" aria-label="Mail folders"></nav>
      <div class="labels-heading"><span>Labels</span><button class="icon-button small" id="newLabelButton" aria-label="Create new label"><svg><use href="#i-plus"/></svg></button></div>
      <nav id="labelNav" class="folder-nav labels-nav"></nav>

    </aside>

    <main class="mail-surface" id="mailSurface">
      <section id="listView" class="list-view">
        <div class="mail-toolbar" id="mailToolbar">
          <div class="toolbar-left">
            <label class="select-control" data-tooltip="Select this page"><input type="checkbox" id="selectAll" aria-label="Select all messages on this page"><span></span></label>
            <button class="icon-button small" id="selectMenuButton" aria-label="Select options" aria-controls="selectPopover" aria-expanded="false"><svg><use href="#i-chevron"/></svg></button>
            <span class="normal-tools">
              <button class="icon-button" id="refreshButton" aria-label="Refresh" data-tooltip="Refresh"><svg><use href="#i-refresh"/></svg></button>
              <button class="icon-button" id="moreButton" aria-label="More" data-tooltip="More" aria-controls="morePopover" aria-expanded="false"><svg><use href="#i-more"/></svg></button>
            </span>
            <span class="bulk-tools">
              <button class="icon-button" data-action="archive" aria-label="Archive" data-tooltip="Archive"><svg><use href="#i-archive"/></svg></button>
              <button class="icon-button" data-action="report" aria-label="Report spam" data-tooltip="Report spam"><svg><use href="#i-report"/></svg></button>
              <button class="icon-button" data-action="delete" aria-label="Delete" data-tooltip="Delete"><svg><use href="#i-trash"/></svg></button>
              <i class="toolbar-separator"></i>
              <button class="icon-button" data-action="read" aria-label="Mark as read" data-tooltip="Mark as read"><svg><use href="#i-mail"/></svg></button>
              <button class="icon-button" data-action="snooze" aria-label="Snooze" data-tooltip="Snooze"><svg><use href="#i-snooze"/></svg></button>
            </span>
          </div>
          <span id="selectionCount" role="status"></span>
          <div class="toolbar-right">
            <button class="range-button" id="rangeButton" aria-live="polite"></button>
            <button class="icon-button small" id="prevPage" aria-label="Newer"><svg><use href="#i-arrow-left"/></svg></button>
            <button class="icon-button small" id="nextPage" aria-label="Older"><svg><use href="#i-arrow-right"/></svg></button>
          </div>
        </div>
        <div class="category-tabs" id="categoryTabs"></div>
        <div class="message-list" id="messageList" role="main" aria-label="Messages"></div>
        <div class="empty-state" id="emptyState">
          <svg><use href="#i-inbox"/></svg>
          <h2>Connect Gmail to see your messages</h2>
          <p>Messages in this folder will appear here.</p>
        </div>
        <footer class="mail-footer"><a href="/privacy">Privacy</a></footer>
      </section>

      <article id="messageView" class="message-view" aria-live="polite">
        <div class="message-toolbar">
          <button class="icon-button" id="backButton" aria-label="Back to inbox"><svg><use href="#i-arrow-left"/></svg></button>
          <button class="icon-button" data-message-action="archive" aria-label="Archive"><svg><use href="#i-archive"/></svg></button>
          <button class="icon-button" data-message-action="report" aria-label="Report spam"><svg><use href="#i-report"/></svg></button>
          <button class="icon-button" data-message-action="delete" aria-label="Delete"><svg><use href="#i-trash"/></svg></button>
          <i class="toolbar-separator"></i>
          <button class="icon-button" data-message-action="unread" aria-label="Mark unread"><svg><use href="#i-mail"/></svg></button>
          <button class="icon-button" data-message-action="snooze" aria-label="Snooze"><svg><use href="#i-snooze"/></svg></button>
          <span class="message-toolbar-spacer"></span>
          <button class="icon-button" id="messagePrev" aria-label="Newer"><svg><use href="#i-arrow-left"/></svg></button>
          <button class="icon-button" id="messageNext" aria-label="Older"><svg><use href="#i-arrow-right"/></svg></button>
        </div>
        <div id="messageContent"></div>
      </article>
    </main>

<aside class="utility-panel" id="utilityPanel">
      <header><h2 id="utilityTitle">Calendar</h2><button class="icon-button" id="closeUtility"><svg><use href="#i-close"/></svg></button></header>
      <div id="utilityContent"></div>
    </aside>

    <aside class="settings-panel" id="settingsPanel">
      <header><h2>Quick settings</h2><button class="icon-button" id="closeSettings"><svg><use href="#i-close"/></svg></button></header>
      <button class="outline-button">See all settings</button>
      <section><h3>Density</h3><label><input type="radio" name="density" value="default" checked> Default</label><label><input type="radio" name="density" value="comfortable"> Comfortable</label><label><input type="radio" name="density" value="compact"> Compact</label></section>
      <section><h3>Theme</h3><div class="theme-options"><button data-theme="light" class="theme light active">Light</button><button data-theme="soft" class="theme soft">Soft</button><button data-theme="dark" class="theme dark">Dark</button></div></section>
      <section><h3>Inbox type</h3><label><input type="radio" name="inboxType" checked> Default</label><label><input type="radio" name="inboxType"> Important first</label><label><input type="radio" name="inboxType"> Unread first</label></section>
      <section><h3>Reading pane</h3><label><input type="checkbox" id="readingPaneToggle"> Enable reading pane</label></section>
    </aside>

<section class="compose-window" id="composeWindow" aria-label="New Message">
      <header><span id="composeTitle">New Message</span><div><button class="icon-button tiny" id="minimizeCompose" aria-label="Minimize"><svg aria-hidden="true"><use href="#i-minimize"/></svg></button><button class="icon-button tiny" id="popoutCompose" aria-label="Full screen"><svg><use href="#i-popout"/></svg></button><button class="icon-button tiny" id="closeCompose" aria-label="Save and close"><svg><use href="#i-close"/></svg></button></div></header>
      <div class="compose-fields">
        <div class="recipient-row"><span>To</span><input id="composeTo" aria-label="Recipients"><button>Cc</button><button>Bcc</button></div>
        <input id="composeSubject" placeholder="Subject" aria-label="Subject">
      </div>
      <div id="composeBody" class="compose-body" contenteditable="true" aria-label="Message body"></div>
      <footer>
        <button class="send-button" id="sendButton"><svg aria-hidden="true"><use href="#i-send"/></svg><span>Send</span></button>
        <button class="icon-button" id="formatButton" aria-label="Formatting options"><b>A</b></button>
        <button class="icon-button" id="attachButton" aria-label="Attach files"><svg><use href="#i-attach"/></svg></button>
        <span></span>
        <button class="icon-button" id="discardButton" aria-label="Discard draft"><svg><use href="#i-trash"/></svg></button>
      </footer>
    </section>

    <div class="popover" id="selectPopover"><button data-select="all"><svg aria-hidden="true"><use href="#i-square-check"/></svg><span>All</span></button><button data-select="none"><svg aria-hidden="true"><use href="#i-square"/></svg><span>None</span></button><button data-select="read"><svg aria-hidden="true"><use href="#i-mail-open"/></svg><span>Read</span></button><button data-select="unread"><svg aria-hidden="true"><use href="#i-mail"/></svg><span>Unread</span></button><button data-select="starred"><svg aria-hidden="true"><use href="#i-star"/></svg><span>Starred</span></button></div>
    <div class="popover" id="morePopover"><button data-more="mark-read" title="Mark every message in this folder or search as read"><svg aria-hidden="true"><use href="#i-mail-open"/></svg><span>Mark all as read</span></button><button data-more="unread"><svg aria-hidden="true"><use href="#i-mail"/></svg><span>Show unread</span></button><button data-more="starred"><svg aria-hidden="true"><use href="#i-star"/></svg><span>Show starred</span></button><button data-more="copy" disabled><svg aria-hidden="true"><use href="#i-copy"/></svg><span>Copy selected sender addresses</span></button><button data-more="clear" disabled><svg aria-hidden="true"><use href="#i-square"/></svg><span>Clear selection</span></button><button data-more="reset"><svg aria-hidden="true"><use href="#i-refresh"/></svg><span>Refresh mailbox</span></button></div>
    <div class="account-popover" id="accountPopover"><button class="avatar large">?</button><strong id="accountName">Not Gmail</strong><span id="accountEmail">Google account not connected</span><button class="outline-button" id="connectGoogleButton">Connect Google Account</button><hr><button id="switchGoogleButton"><svg aria-hidden="true"><use href="#i-user-plus"/></svg><span>Connect another account</span></button><button id="signOutButton"><svg aria-hidden="true"><use href="#i-logout"/></svg><span>Sign out</span></button><small id="accountStatus">Connect Google to send real email</small></div>
    <div class="apps-popover" id="appsPopover"><button><span class="app-dot blue">D</span>Drive</button><button><span class="app-dot red">C</span>Calendar</button><button><span class="app-dot green">S</span>Sheets</button><button><span class="app-dot yellow">K</span>Keep</button></div>
    <div class="toast" id="toast" role="status"><span id="toastText">Conversation archived</span><button id="undoButton">Undo</button><button class="icon-button tiny" id="closeToast"><svg><use href="#i-close"/></svg></button></div>
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <dialog id="labelDialog"><form method="dialog"><h2>New label</h2><label>Please enter a new label name:<input id="newLabelInput" autocomplete="off"></label><div><button value="cancel" class="text-button">Cancel</button><button value="default" class="primary-button" id="createLabelConfirm">Create</button></div></form></dialog>
  </div>

  <script src="app.js"></script>
</body>
</html>
